<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <!-- AI circuit pattern -->
    <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="20" cy="20" r="2" fill="#92400E" opacity="0.15"/>
      <line x1="20" y1="0" x2="20" y2="18" stroke="#92400E" stroke-width="1" opacity="0.1"/>
      <line x1="22" y1="20" x2="40" y2="20" stroke="#92400E" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="url(#circuit)"/>

  <!-- Warm glow behind house -->
  <ellipse cx="256" cy="340" rx="140" ry="60" fill="url(#glow)"/>

  <!-- House body -->
  <rect x="166" y="240" width="180" height="140" rx="8" fill="url(#wall)"/>

  <!-- Roof -->
  <path d="M140 248 L256 148 L372 248 Z" fill="url(#roof)"/>
  <!-- Roof overhang shadow -->
  <path d="M150 248 L256 155 L362 248 Z" fill="none" stroke="#78350F" stroke-width="3"/>

  <!-- Chimney -->
  <rect x="310" y="165" width="28" height="60" rx="4" fill="#92400E"/>
  <!-- Chimney smoke (AI signal waves) -->
  <path d="M324 155 Q330 140 324 125" fill="none" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M324 125 Q318 110 324 95" fill="none" stroke="#FEF3C7" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M324 95 Q330 80 324 68" fill="none" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Door -->
  <rect x="232" y="295" width="48" height="85" rx="24 24 0 0" fill="#92400E"/>
  <circle cx="270" cy="340" r="5" fill="#FBBF24"/>

  <!-- Windows -->
  <!-- Left window -->
  <rect x="182" y="265" width="36" height="36" rx="4" fill="#FEF3C7" stroke="#92400E" stroke-width="3"/>
  <line x1="200" y1="265" x2="200" y2="301" stroke="#92400E" stroke-width="2"/>
  <line x1="182" y1="283" x2="218" y2="283" stroke="#92400E" stroke-width="2"/>
  <!-- Window glow -->
  <rect x="184" y="267" width="14" height="14" rx="2" fill="#FBBF24" opacity="0.4"/>
  <rect x="202" y="267" width="14" height="14" rx="2" fill="#FBBF24" opacity="0.3"/>
  <rect x="184" y="285" width="14" height="14" rx="2" fill="#FBBF24" opacity="0.3"/>
  <rect x="202" y="285" width="14" height="14" rx="2" fill="#FBBF24" opacity="0.5"/>

  <!-- Right window -->
  <rect x="294" y="265" width="36" height="36" rx="4" fill="#FEF3C7" stroke="#92400E" stroke-width="3"/>
  <line x1="312" y1="265" x2="312" y2="301" stroke="#92400E" stroke-width="2"/>
  <line x1="294" y1="283" x2="330" y2="283" stroke="#92400E" stroke-width="2"/>
  <rect x="296" y="267" width="14" height="14" rx="2" fill="#FBBF24" opacity="0.5"/>
  <rect x="314" y="267" width="14" height="14" rx="2" fill="#FBBF24" opacity="0.3"/>
  <rect x="296" y="285" width="14" height="14" rx="2" fill="#FBBF24" opacity="0.3"/>
  <rect x="314" y="285" width="14" height="14" rx="2" fill="#FBBF24" opacity="0.4"/>

  <!-- AI "eyes" in the roof triangle — two friendly dots -->
  <circle cx="236" cy="215" r="10" fill="#FEF3C7"/>
  <circle cx="276" cy="215" r="10" fill="#FEF3C7"/>
  <circle cx="238" cy="214" r="5" fill="#78350F"/>
  <circle cx="278" cy="214" r="5" fill="#78350F"/>
  <!-- Subtle smile -->
  <path d="M242 228 Q256 238 270 228" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>

  <!-- Small AI nodes on sides -->
  <circle cx="130" cy="300" r="4" fill="#FEF3C7" opacity="0.6"/>
  <circle cx="115" cy="270" r="3" fill="#FEF3C7" opacity="0.4"/>
  <line x1="130" y1="300" x2="166" y2="290" stroke="#FEF3C7" stroke-width="1.5" opacity="0.3"/>
  <line x1="115" y1="270" x2="130" y2="300" stroke="#FEF3C7" stroke-width="1" opacity="0.3"/>

  <circle cx="382" cy="300" r="4" fill="#FEF3C7" opacity="0.6"/>
  <circle cx="397" cy="270" r="3" fill="#FEF3C7" opacity="0.4"/>
  <line x1="382" y1="300" x2="346" y2="290" stroke="#FEF3C7" stroke-width="1.5" opacity="0.3"/>
  <line x1="397" y1="270" x2="382" y2="300" stroke="#FEF3C7" stroke-width="1" opacity="0.3"/>

  <!-- Ground line -->
  <line x1="120" y1="380" x2="392" y2="380" stroke="#92400E" stroke-width="2" opacity="0.3"/>
</svg>